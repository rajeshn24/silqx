<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILQX | Modern Fashion & Apparel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #f5f5f5;
            overflow-x: hidden;
        }

        /* Header / Nav */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            position: absolute;
            width: 100%;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #cccccc;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            padding: 0 1rem;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero-content h1 {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .hero-content p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: #cccccc;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        /* Signup Form */
        .signup-form {
            display: flex;
            gap: 0.5rem;
            max-width: 450px;
            margin: 0 auto;
        }

        .signup-form input {
            flex: 1;
            padding: 1rem 1.25rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
            font-size: 0.95krem;
            backdrop-filter: blur(5px);
            transition: border-color 0.3s;
        }

        .signup-form input:focus {
            border-color: #ffffff;
        }

        .signup-form button {
            padding: 1rem 2rem;
            border-radius: 50px;
            border: none;
            background: #ffffff;
            color: #0d0d0d;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .signup-form button:hover {
            background: #e6e6e6;
            transform: translateY(-2px);
        }

        /* Footer Note */
        footer {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            color: #777;
            font-size: 0.85rem;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .signup-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">LIVOFOX</a>
        <ul class="nav-links">
            <li><a href="#">Collection</a></li>
            <li><a href="#">Story</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Redefine Your Style</h1>
            <p>The next evolution in modern apparel is coming soon. Sign up for early access and exclusive launch drops.</p>
            
            <form class="signup-form" onsubmit="event.preventDefault(); alert('Thank you for joining the LIVOFOX waitlist!');">
                <input type="email" placeholder="Enter your email address" required>
                <button type="submit">Notify Me</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 SILQX. All Rights Reserved.</p>
    </footer>

</body>
</html>
